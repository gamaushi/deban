<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出番ですョ!</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出番ですョ!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1E6FB8">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
/* 画面構成：上に青い帯（班・年月・設定）と曜日を固定し、その下に月が縦に続く */
:root {
  --blue: #1E6FB8; --blue2: #2989D8; --bg: #F5F5F5; --white: #fff; --ink: #222; --ink2: #555; --muted: #888;
  --grid: #CEDDE2; --label-bg: #EFF8FF; --week-line: #B0C4DE;
  --sun: #E00000; --sat: #0050E0; --today: #008000; --orange: #CC6600; --red: #CC0000; --green: #008000; --amber: #FF6600;
  --c-revenue: #D8BFD8; --c-work: #E6E6FA; --c-paid: #FFE6E6; --c-absent: #FFCCCC;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: light;
  --k: 1;   /* 端末の文字サイズ設定を打ち消す倍率（app.js で計算） */
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: none; text-size-adjust: none; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--safe-t); background: var(--blue); z-index: 30; }

/* ===== 上部 ===== */
/* パソコンなど広い画面では、横に間延びしないよう幅に上限をつけて真ん中に置く */
@media (min-width: 900px) {
  html { background: #CBD5E1; }
  body { max-width: 860px; margin: 0 auto; box-shadow: 0 0 24px rgba(0,0,0,.18); min-height: 100vh; }
}
#top { position: sticky; top: var(--safe-t); z-index: 20; background: var(--bg); }
.bar { display: flex; align-items: center; gap: 4px; background: var(--blue); color: #fff;
  padding: 3px max(6px, var(--safe-r)) 3px max(6px, var(--safe-l)); min-height: 46px; flex-wrap: nowrap; }
.pat { border: 0; border-radius: 6px; padding: 5px 9px; font-weight: 700; color: #1E3A5F; white-space: nowrap; font-size: calc(15px * var(--k)); }
.title { flex: 1; min-width: 0; border: 0; background: none; color: #fff; font-size: calc(20px * var(--k)); font-weight: 700; padding: 4px 0;
  overflow: hidden; height: 36px; position: relative; }
.title span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
.title span.in-up { animation: inUp .45s ease both; } .title span.out-up { animation: outUp .45s ease both; }
.title span.in-down { animation: inDown .45s ease both; } .title span.out-down { animation: outDown .45s ease both; }
@keyframes inUp { from { transform: translateY(100%); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes outUp { from { transform: none; opacity: 1 } to { transform: translateY(-100%); opacity: 0 } }
@keyframes inDown { from { transform: translateY(-100%); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes outDown { from { transform: none; opacity: 1 } to { transform: translateY(100%); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .title span { animation: none !important; } }
.seg { display: flex; border: 1px solid #fff; border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; color: #fff; font-size: calc(13px * var(--k)); padding: 3px 7px; }
.seg button.on { background: #fff; color: var(--blue); font-weight: 700; }
.gear { border: 0; background: none; color: #fff; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--label-bg);
  margin: 0 max(4px, var(--safe-r)) 0 max(4px, var(--safe-l)); }
.week div { text-align: center; font-weight: 700; font-size: calc(14px * var(--k)); border: .5px solid var(--week-line); padding: 1px 0; }
.week .su { color: var(--sun); } .week .sa { color: var(--sat); }

.patmenu { position: absolute; left: max(6px, var(--safe-l)); top: 46px; background: #fff; border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.25); overflow: hidden; z-index: 40; min-width: 160px; }
.patmenu button { display: block; width: 100%; text-align: left; border: 0; padding: 11px 16px; font-size: calc(17px * var(--k)); border-bottom: 1px solid rgba(0,0,0,.06); }

/* ===== カレンダー ===== */
#months { padding: 0 max(4px, var(--safe-r)) calc(16px + var(--safe-b)) max(4px, var(--safe-l)); }
.month { padding-bottom: 10px; }
.mtitle { text-align: center; font-size: calc(16px * var(--k)); font-weight: 700; color: #333; padding: 3px 0; }
.mtitle.now { background: #7DD3FC; color: #0C3A5B; font-size: calc(18px * var(--k)); border-radius: 6px 6px 0 0; padding: 4px 0; }
.nowbox { border: 3px solid #7DD3FC; border-radius: 8px; overflow: hidden; }
.nowbox .mtitle.now { border-radius: 0; }
.mtitle .nowtag { display: inline-block; background: #fff; color: #0C3A5B; font-size: calc(12px * var(--k)); border-radius: 10px; padding: 0 8px; margin-left: 6px; vertical-align: 2px; line-height: 1.6; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: #fff; }
.cell { min-height: 80px; border: .5px solid var(--grid); padding: 2px; display: flex; flex-direction: column;
  justify-content: space-between; align-items: center; overflow: hidden; position: relative; background: #fff; }
.simple .cell { min-height: 50px; justify-content: flex-start; gap: 3px; }
.cell.day { cursor: pointer; }
.cell.day:active { filter: brightness(.93); }
.cell.red::after { content: ""; position: absolute; inset: 0; border: 2.5px solid red; pointer-events: none; }
.r1 { display: flex; align-items: center; width: 100%; line-height: 1.1; }
.r1 .sp { flex: 1; }
.dn { font-weight: 700; font-size: calc(21px * var(--k)); letter-spacing: -.5px; line-height: 1.1; padding: 1px 3px; border-radius: 999px; min-width: 1.25em; text-align: center; }
.dn.cl { font-size: calc(15px * var(--k)); }
.simple .dn { font-size: calc(22px * var(--k)); }
.dn.su { color: var(--sun); } .dn.sa { color: var(--sat); }
.dn.hol { background: var(--sun); color: #fff; } .dn.td { background: var(--today); color: #fff; } .dn.hol.td { background: var(--sun); color: var(--today); }
.gm { color: var(--orange); font-size: calc(10px * var(--k)); line-height: 1; }
.wx { font-size: calc(15px * var(--k)); line-height: 1; } .wx.sm { font-size: calc(12px * var(--k)); }
.drv { font-size: calc(13px * var(--k)); font-weight: 500; color: #333; line-height: 1.1; white-space: nowrap; }
.duty { font-size: calc(11px * var(--k)); line-height: 1.1; white-space: nowrap; }
.val { width: 100%; text-align: center; font-size: calc(12px * var(--k)); font-weight: 500; line-height: 1.1; padding: 2px 0; white-space: nowrap; overflow: hidden;
  letter-spacing: -.4px; border: .5px solid #999; border-radius: 3px; min-height: 17px; font-variant-numeric: tabular-nums; }
.val.rev { font-weight: 700; }
.simple .val.bare { border: 0; background: transparent !important; }

/* 集計 */
.sum { margin-top: 4px; background: #fff; border: .5px solid var(--grid); }
.srow { display: flex; align-items: stretch; border: .5px solid var(--grid); }
/* 見出しは折り返さない（ブラウザの「最小フォントサイズ」設定などで文字が大きくなっても、幅を広げて1行に収める） */
.slabel { min-width: 58px; flex: none; background: var(--label-bg); font-size: calc(12px * var(--k)); font-weight: 700; color: #333;
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 5px; white-space: nowrap; }
.sitems { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 4px 6px; font-size: calc(13px * var(--k)); align-items: center; }
.sitems span { white-space: nowrap; }
.b { font-weight: 700; }
.c-red { color: var(--red); } .c-green { color: var(--green); } .c-amber { color: var(--amber); } .c-orange { color: var(--orange); } .c-gray { color: gray; } .c-alert { color: red; }
.salbtn { background: #4CAF50; color: #fff; border: 0; border-radius: 4px; font-size: calc(13px * var(--k)); font-weight: 700; padding: 3px 10px; }

/* ===== 給料・設定画面 ===== */
.view { min-height: 100vh; background: #F0F4F8; }
.vbar { position: sticky; top: var(--safe-t); z-index: 20; display: flex; align-items: center; gap: 6px; background: var(--blue); color: #fff;
  padding: 4px max(8px, var(--safe-r)) 4px max(4px, var(--safe-l)); min-height: 50px; font-size: 19px; font-weight: 700; }
.back { border: 0; background: none; color: #fff; font-size: 24px; width: 44px; height: 44px; padding: 0; }
.vbody { padding: 12px max(12px, var(--safe-r)) calc(28px + var(--safe-b)) max(12px, var(--safe-l)); display: flex; flex-direction: column; gap: 12px; max-width: 640px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.card h2 { margin: 0; font-size: 17px; }
.hrow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.kseg { display: inline-flex; border: 1.5px solid #C2670A; border-radius: 8px; overflow: hidden; flex: none; }
.kseg button { border: 0; background: #fff; color: #C2670A; font-size: 14px; font-weight: 700; padding: 4px 12px; }
.kseg button.on { background: #C2670A; color: #fff; }
.badge { font-size: 13px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
.irow { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #EEF2F6; font-variant-numeric: tabular-nums; }
.irow b { font-weight: 500; }
.total { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 14px; border-radius: 10px;
  background: linear-gradient(90deg, var(--blue), var(--blue2)); color: #fff; font-weight: 700; }
.total .n { font-size: 24px; font-variant-numeric: tabular-nums; }
.diff { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; padding: 10px; border-radius: 8px; background: #FAFBFC; color: #5A7896; }
.note { font-size: 12px; color: red; }
.sub { font-size: 13px; color: gray; }
.frow { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.frow > .lbl { flex: 1; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 13px; color: var(--ink2); }
.inp { width: 100%; border: 1px solid #B8C4D0; border-radius: 8px; padding: 10px 12px; font-size: 17px; background: #fff; }
.inp:focus { outline: 2px solid var(--blue); border-color: var(--blue); }
.inp.err { border-color: red; outline-color: red; }
.stepper { display: flex; align-items: center; }
.stepper button { border: 0; background: none; color: var(--blue); font-size: 18px; width: 40px; height: 40px; }
.stepper .v { font-weight: 700; font-size: 16px; min-width: 9em; text-align: center; }
.radio { display: inline-flex; align-items: center; gap: 4px; margin-right: 6px; }
.radio input { width: 20px; height: 20px; accent-color: var(--blue); }
.tg { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: #CCC; position: relative; flex: none; transition: background .2s; margin: 0; }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.tg:checked { background: #34C759; } .tg:checked::after { transform: translateX(20px); }
.pen { background: #F4F8FC; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.warn { background: #FFF3CD; border-radius: 6px; padding: 8px; color: #7A5A00; font-size: 13px; }
.memo { background: #FFFDF5; border-radius: 8px; padding: 12px; font-size: 13px; color: #5A4D1E; }
.btn { border: 0; border-radius: 22px; background: var(--blue); color: #fff; font-weight: 600; padding: 10px 18px; font-size: 15px; }
.btn.wide { width: 100%; font-size: 16px; }
.btn.ghost { background: none; color: var(--blue); padding: 8px 10px; }
.btn.line { background: #fff; color: var(--blue); border: 1px solid #B8C4D0; }
.btn:disabled { opacity: .45; }
.btn.danger { color: #C53030; }
.big { font-size: 22px; font-weight: 700; }
.help { margin: 0; padding-left: 1.1em; font-size: 14px; line-height: 1.6; }
table.rt { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.rt th, table.rt td { border: 1px solid #DDE5EC; padding: 3px 6px; text-align: right; }
table.rt th { background: var(--label-bg); text-align: center; }

/* ===== ダイアログ ===== */
.ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: calc(12px + var(--safe-t)) max(12px, var(--safe-r)) calc(12px + var(--safe-b)) max(12px, var(--safe-l)); }
.dlg { background: #fff; border-radius: 22px; width: 100%; max-width: 420px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.dlg .dh { padding: 18px 20px 6px; font-size: 20px; font-weight: 700; }
.dlg .db { padding: 4px 20px 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 6px; }
.dlg .df { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 14px 14px; flex-wrap: wrap; }
.hn { font-size: 15px; color: var(--sun); font-weight: 400; }
.wbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.wbtns button:disabled { opacity: .35; text-decoration: line-through; border-style: dashed; }
.wbtns button { border: 1px solid #9AA8B6; background: #fff; border-radius: 20px; padding: 8px 2px; font-size: 15px; color: var(--blue); }
.wbtns button:active { background: #E8F0F8; }
.inwrap { position: relative; }
.inwrap .clr { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 18px; color: #888; width: 36px; height: 36px; }
.errtxt { color: red; font-size: 13px; min-height: 1em; }
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mgrid button { border: 0; border-radius: 8px; background: #F0F4F8; padding: 10px 0; font-size: 18px; color: #222; }
.mgrid button.now { color: var(--today); font-weight: 700; }
.mgrid button.cur { background: var(--blue); color: #fff; font-weight: 700; }
.dlg pre { white-space: pre-wrap; margin: 0; font: inherit; }

#toast { position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: #323232; color: #fff; padding: 12px 16px; border-radius: 8px; z-index: 60; width: calc(100% - 32px); max-width: 480px;
  font-size: 14px; transition: opacity .25s, transform .25s; }
#toast.show { opacity: 1; transform: translateX(-50%); }
</style>
<script>
// LINEの中のブラウザでは「ホーム画面に追加」が出ないので、いつものブラウザで開き直す
// （LINEは URL に openExternalBrowser=1 が付いていると外のブラウザで開く）
(function(){
  if (/\bLine\//i.test(navigator.userAgent) && !/[?&]openExternalBrowser=1/.test(location.search)){
    var u = new URL(location.href);
    u.searchParams.set('openExternalBrowser', '1');
    location.replace(u.toString());
  }
})();
</script>
</head>
<body>
<div id="calView">
  <header id="top">
    <div class="bar">
      <button id="patBtn" class="pat" aria-haspopup="true"></button>
      <button id="title" class="title" aria-label="年月を選ぶ"><span></span></button>
      <div id="modeSw" class="seg" hidden>
        <button data-simple="0">詳細</button><button data-simple="1">簡易</button>
      </div>
      <button id="gear" class="gear" aria-label="設定">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.92 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.72 8.47a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.07.63-.07.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </div>
    <div class="week"><div class="su">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sa">土</div></div>
  </header>
  <main id="months"></main>
</div>
<div id="salaryView" class="view" hidden></div>
<div id="settingView" class="view" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
